# Integração contínua do pointclick: compila e roda os testes em macOS, Linux e Windows.
# Cada job usa os presets do CMakePresets.json, sem flags soltas, para que a mesma linha rode
# na máquina de quem desenvolve. Os testes gráficos usam o driver de vídeo "dummy" e o renderer
# de software do SDL (definidos nos próprios testes), então não precisam de display.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fontes das dependências (SDL3, SDL3_ttf, FreeType, doctest) baixadas pelo CPM; ver cmake/CPM.cmake.
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.ci-cache/cpm
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  CCACHE_COMPILERCHECK: content
  CTEST_OUTPUT_ON_FAILURE: "1"
  # Sem display nem placa de som nos runners; os testes já pedem "dummy", isto cobre o executável.
  SDL_VIDEO_DRIVER: dummy
  SDL_AUDIO_DRIVER: dummy

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AppleClang)
            os: macos-latest
            preset: debug
            werror: "ON"
            exe: build/debug/pointclick
          - name: Linux (clang)
            os: ubuntu-24.04
            preset: debug
            cc: clang
            cxx: clang++
            werror: "ON"
            exe: build/debug/pointclick
          - name: Linux (gcc)
            os: ubuntu-24.04
            preset: debug
            cc: gcc
            cxx: g++
            werror: "ON"
            exe: build/debug/pointclick
          # Gerador padrão do Windows (Visual Studio, x64 no runner x64): multi-configuração,
          # por isso o executável fica em build/debug/Debug. /WX fica desligado até a primeira
          # execução real mostrar o que o /W4 diz (docs/ROADMAP.md, seção 3.3).
          - name: Windows (MSVC)
            os: windows-latest
            preset: debug
            werror: "OFF"
            exe: build/debug/Debug/pointclick.exe
          - name: Linux (clang, ASan + UBSan)
            os: ubuntu-24.04
            preset: asan
            cc: clang
            cxx: clang++
            werror: "ON"
            exe: build/asan/pointclick
          # Build de loja: Release sem o editor. Os asserts dos testes continuam ativos.
          - name: Linux (gcc, Release sem ferramentas)
            os: ubuntu-24.04
            preset: store
            cc: gcc
            cxx: g++
            werror: "ON"
            exe: build/store/pointclick
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 24.04 não tem pacote do SDL3 na versão mínima: o CPM compila o SDL3 e o SDL3_ttf
      # (com o FreeType do sistema). Os pacotes abaixo são os cabeçalhos que o SDL3 precisa para
      # montar os backends de desktop, como numa build de verdade.
      - name: Dependências (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache pkg-config libfreetype-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      # O Homebrew traz o SDL3 e o SDL3_ttf; se a versão dele for anterior à de referência
      # (cmake/Dependencies.cmake), o CMake avisa e o CPM compila a de referência.
      - name: Dependências (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3 sdl3_ttf ccache

      - name: Cache das fontes do CPM
        uses: actions/cache@v4
        with:
          path: .ci-cache/cpm
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake') }}
          restore-keys: |
            cpm-${{ runner.os }}-

      # O CMakeLists.txt já usa sccache/ccache quando encontra um no PATH. Com o gerador do
      # Visual Studio o lançador de compilador não se aplica, então o Windows fica só com o
      # cache das fontes.
      - name: Cache de compilação (ccache)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: .ci-cache/ccache
          key: ccache-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.name }}-

      - name: Compilador
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configurar
        run: cmake --preset ${{ matrix.preset }} -DPOINTCLICK_WARNINGS_AS_ERRORS=${{ matrix.werror }}

      - name: Compilar
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Testes
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Validar os assets (--check)
        shell: bash
        run: ${{ matrix.exe }} --rooms assets/rooms --check

      - name: Estatísticas do ccache
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats
